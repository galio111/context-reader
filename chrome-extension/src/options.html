<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Context Reader · 划词设置</title><link rel="stylesheet" href="options.css"></head><body><main><header><a href="https://context-reader.com/browser-extension" target="_blank" rel="noreferrer">Context Reader</a><h1>让解释适合你的阅读</h1><p>在网页划选英文，再按快捷键。外观会自动保存。</p></header><section aria-labelledby="account-title"><h2 id="account-title">保存账号</h2><p id="account">正在检查连接…</p><a class="button" href="https://context-reader.com/browser-extension" target="_blank" rel="noreferrer">在网站连接或更换账号 ↗</a></section><section aria-labelledby="trigger-title"><h2 id="trigger-title">触发方式</h2><button id="shortcuts" type="button">设置 Chrome 快捷键 ↗</button><p id="shortcut" class="note"></p><label class="toggle"><input type="checkbox" id="autoLookup">划词后自动显示解释</label><p class="note">关闭时只在按快捷键或选择右键菜单后查询。</p></section><section aria-labelledby="appearance-title"><h2 id="appearance-title">浮窗外观</h2><div class="sizes"><label>宽度 <span><input id="width" type="number" min="300" max="900" step="10"> px</span></label><label>高度 <span><input id="height" type="number" min="240" max="1000" step="10"> px</span></label></div><p class="note">也可以拖动浮窗右下角调整大小，拖动标题栏移动。</p><label class="opacity">背景不透明度 <output id="opacityValue">96%</output><input id="opacity" type="range" min="20" max="100" step="1"></label><div class="colors"><label>背景 <input type="color" id="background"></label><label>文字 <input type="color" id="text"></label><label>强调色 <input type="color" id="accent"></label></div><div id="preview"><small>语境解释预览</small><h3>perspective <span>/pəˈspektɪv/</span></h3><b>所选词在本句中的含义</b><p>看待问题的角度；这里指理解事物的不同方式。</p><span class="preview-button">加入生词本</span></div><p id="contrast" role="status" class="note"></p><button id="reset" type="button">恢复默认外观</button><p id="status" role="status" class="note"></p></section><footer>仅支持普通网页中的可选择文字。图片、Chrome 系统页面和内置 PDF 阅读器暂不支持。</footer></main><script type="module" src="options.js"></script></body></html>
