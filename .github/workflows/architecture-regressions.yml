name: Architecture and reading regressions

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reading-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Architecture, account storage and critical reading regressions
        run: npm run test:architecture
      - name: Provider fallback preserves one user charge
        run: node --import ./scripts/test-server-context.mjs --import tsx --test tests/provider-failover.test.ts tests/provider-billing.test.ts
      - name: Study entry, cache and answer recovery
        run: node --import ./scripts/test-server-context.mjs --import tsx --test tests/study-*.test.ts tests/study-*.test.tsx
      - name: Old-page assets and Reader failure recovery
        run: npm run test:release-safety
      - run: npm run verify:release-contracts
      - run: npm run audit:egress
      - run: npm run build
