<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Context Reader 离线模式</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 15% 12%, rgb(112 160 199 / 18%), transparent 26rem),
          radial-gradient(circle at 88% 82%, rgb(94 130 165 / 12%), transparent 30rem),
          linear-gradient(145deg, #e9eff4 0%, #f4f6f8 44%, #e7edf2 100%);
        background-attachment: fixed;
        color: #17212b;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      section {
        max-width: 560px;
        border-radius: 16px;
        background: #fbfcfe;
        padding: 24px;
        box-shadow: 0 4px 8px rgb(43 61 77 / 10%);
      }
      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }
      p {
        color: #536675;
        line-height: 1.6;
      }
      a {
        color: #174f82;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>当前离线</h1>
        <p>Context Reader 已进入离线模式。已缓存的网站外壳和最近打开过的公开文章仍可使用；新的 AI 解释、URL 导入和 OCR 需要联网。</p>
        <p><a href="/home-v2">返回首页</a></p>
      </section>
    </main>
  </body>
</html>
