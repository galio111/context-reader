<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Context Reader 离线模式</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f5f7;
        color: #1d1d1f;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      section {
        max-width: 560px;
        border-radius: 18px;
        background: #fff;
        padding: 24px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }
      p {
        color: #333;
        line-height: 1.6;
      }
      a {
        color: #0066cc;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>当前离线</h1>
        <p>Context Reader 已进入离线模式。已缓存的网站外壳和最近打开过的公开文章仍可使用；新的 AI 解释、URL 导入和 OCR 需要联网。</p>
        <p><a href="/">返回首页</a></p>
      </section>
    </main>
  </body>
</html>
