<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Context Reader 持续设计问卷 · 安全找回密码 24</title>
  <style>
    :root { color-scheme:light; --ink:#153746; --muted:#66808b; --paper:#f7fbfb; --card:#fff; --line:#ccdcdf; --accent:#14677d; --soft:#e7f3f5; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 10% 5%,#dfeff1,transparent 34%),var(--paper); color:var(--ink); font-family:"Microsoft YaHei UI","PingFang SC",sans-serif; }
    main { width:min(860px,calc(100% - 32px)); margin:48px auto 120px; }
    .eyebrow { letter-spacing:.18em; font-size:12px; color:var(--accent); font-weight:700; }
    h1 { margin:10px 0 14px; font:500 clamp(30px,5vw,52px)/1.12 Georgia,"Noto Serif SC",serif; }
    .lead { max-width:720px; color:var(--muted); line-height:1.75; }
    .warning { margin:24px 0; padding:16px 18px; border:1px solid #e9c7ad; border-radius:16px; background:#fff8f1; line-height:1.7; }
    fieldset { margin:18px 0; padding:22px; border:1px solid var(--line); border-radius:20px; background:rgba(255,255,255,.92); box-shadow:0 16px 44px rgba(19,70,82,.07); }
    legend { padding:0 8px; font-weight:800; }
    label.option { display:block; margin:10px 0; padding:14px 16px; border:1px solid var(--line); border-radius:14px; cursor:pointer; line-height:1.55; transition:.16s ease; }
    label.option:has(input:checked) { border-color:var(--accent); background:var(--soft); transform:translateX(3px); }
    input { margin-right:9px; accent-color:var(--accent); }
    textarea { width:100%; min-height:82px; resize:vertical; margin-top:10px; border:1px solid var(--line); border-radius:12px; padding:12px; font:inherit; color:inherit; }
    .actions { position:sticky; bottom:12px; display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; padding:12px; border:1px solid var(--line); border-radius:18px; background:rgba(247,251,251,.94); backdrop-filter:blur(14px); }
    button { border:0; border-radius:999px; padding:12px 18px; font:700 14px inherit; cursor:pointer; }
    button.primary { color:#fff; background:var(--accent); }
    button.secondary { color:var(--ink); background:#deedf0; }
    #output { width:100%; min-height:160px; margin-top:16px; white-space:pre-wrap; }
    .status { align-self:center; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">CONTEXT READER · ROUND 24</div>
  <h1>安全找回密码</h1>
  <p class="lead">第 23 轮其余答案已经冻结并进入实现。这里只追问一个无法安全猜测的决定：手机号目前不发短信、也未验证归属，因此“昵称 + 手机号”只能帮助定位账号，不能证明来操作的人就是账号主人。</p>
  <div class="warning">如果仅凭昵称和手机号就允许重设密码，知道这两项信息的人都可能接管账号。所以下列方案都保留账号所有权证明，不会把安全责任推给普通用户。</div>
  <form id="survey">
    <fieldset>
      <legend>341. 当前 Beta 的忘记密码路径采用哪一种？</legend>
      <label class="option"><input type="radio" name="q341" value="A. 管理员辅助找回（推荐）：用户提交昵称、手机号与必要的历史信息，管理员核对后发一次性临时密码；登录后必须立即改密。">A. 管理员辅助找回（推荐）：提交账号信息，核对后签发一次性临时密码</label>
      <label class="option"><input type="radio" name="q341" value="B. 暂不开放找回：等短信验证码具备合规资质并真实验证手机号后，再提供自助找回。">B. 暂不开放找回：等待短信归属验证上线</label>
      <label class="option"><input type="radio" name="q341" value="C. 预生成恢复码：用户登录后可主动生成并离线保存一组恢复码，忘记密码时凭恢复码重设。">C. 预生成恢复码：登录时由用户提前保存</label>
    </fieldset>
    <fieldset>
      <legend>342. 完成所有权核验后，恢复流程怎样结束？</legend>
      <label class="option"><input type="radio" name="q342" value="A. 设置新密码后回到登录框，由用户明确登录（推荐）。">A. 设置新密码后回到登录框，由用户明确登录（推荐）</label>
      <label class="option"><input type="radio" name="q342" value="B. 设置新密码后自动登录当前设备。">B. 设置新密码后自动登录当前设备</label>
    </fieldset>
    <fieldset>
      <legend>343. 现有六位数字密码用户如何迁移？</legend>
      <label class="option"><input type="radio" name="q343" value="A. 旧密码继续可登录；用户下次主动改密时执行新规则（推荐）。">A. 继续兼容旧密码，主动改密时升级（推荐）</label>
      <label class="option"><input type="radio" name="q343" value="B. 下次登录成功后必须立即改为字母加数字的新密码。">B. 下次登录成功后强制改密</label>
      <textarea name="note343" placeholder="如果你还关心找回时需要核对哪些历史信息，可以补充；不填也没关系。"></textarea>
    </fieldset>
  </form>
  <div class="actions">
    <button class="primary" type="button" id="generate">一键生成答案</button>
    <button class="secondary" type="button" id="copy">复制答案</button>
    <span class="status" id="status">选择会自动保存在这台浏览器</span>
  </div>
  <textarea id="output" readonly placeholder="生成后的答案会出现在这里"></textarea>
</main>
<script>
  const key = 'context-reader-design-survey-r24';
  const form = document.querySelector('#survey');
  const output = document.querySelector('#output');
  const status = document.querySelector('#status');
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  for (const el of form.elements) {
    if (!el.name || saved[el.name] == null) continue;
    if (el.type === 'radio') el.checked = saved[el.name] === el.value;
    else el.value = saved[el.name];
  }
  function snapshot() {
    const data = {};
    for (const el of form.elements) {
      if (!el.name) continue;
      if (el.type === 'radio') { if (el.checked) data[el.name] = el.value; }
      else data[el.name] = el.value.trim();
    }
    localStorage.setItem(key, JSON.stringify(data));
    return data;
  }
  form.addEventListener('input', () => { snapshot(); status.textContent = '已自动保存'; });
  function generate() {
    const data = snapshot();
    output.value = [
      '# Context Reader 持续设计问卷 · 安全找回密码 24', '',
      `341. ${data.q341 || '未选择'}`,
      `342. ${data.q342 || '未选择'}`,
      `343. ${data.q343 || '未选择'}`,
      data.note343 ? `补充：${data.note343}` : ''
    ].filter(Boolean).join('\n');
    status.textContent = '答案已生成';
  }
  document.querySelector('#generate').addEventListener('click', generate);
  document.querySelector('#copy').addEventListener('click', async () => {
    if (!output.value) generate();
    await navigator.clipboard.writeText(output.value);
    status.textContent = '已复制，可以直接发给 Codex';
  });
</script>
</body>
</html>
