<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Context Reader 书本模型与翻页方案选择</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172530;
      --muted: #607381;
      --blue: #2868ad;
      --line: #cbd8e1;
      --paper: #f8fbfd;
      --wash: #eaf1f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(145deg, #e8eff4, #f7f9fb 48%, #e7eef3);
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, textarea { font: inherit; }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    .intro { display: grid; grid-template-columns: 1.15fr .85fr; gap: 42px; align-items: end; }
    .intro h1 { max-width: 13ch; margin: 0; font: 500 clamp(38px, 5vw, 68px)/1.05 Georgia, "Songti SC", serif; letter-spacing: -.035em; text-wrap: balance; }
    .intro p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .notice { margin: 32px 0 0; padding: 18px 20px; color: #35546a; background: #ddeaf2; border-radius: 12px; font-size: 13px; line-height: 1.7; }
    fieldset { margin: 46px 0 0; padding: 0; border: 0; }
    legend { margin-bottom: 18px; font-size: 18px; font-weight: 700; }
    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .choice { position: relative; display: grid; min-width: 0; padding: 22px; gap: 18px; border-radius: 14px; color: inherit; background: rgb(248 251 253 / 94%); box-shadow: 0 4px 8px rgb(49 67 81 / 12%); cursor: pointer; }
    .choice input { position: absolute; top: 18px; right: 18px; width: 18px; height: 18px; accent-color: var(--blue); }
    .choice:has(input:checked) { outline: 3px solid rgb(40 104 173 / 32%); outline-offset: 2px; }
    .choice h2 { margin: 0; font-size: 18px; }
    .choice h2 span { display: block; margin-top: 5px; color: var(--blue); font-size: 12px; font-weight: 700; }
    .choice p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .choice ul { margin: 0; padding-left: 18px; color: #3f5666; font-size: 12px; line-height: 1.7; }
    .choice a { justify-self: start; color: var(--blue); font-size: 12px; font-weight: 700; text-decoration: none; }
    .choice a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .badge { justify-self: start; padding: 5px 9px; border-radius: 999px; color: #36566d; background: #e3edf4; font-size: 10px; font-weight: 700; }
    .book-preview { position: relative; height: 166px; perspective: 900px; overflow: hidden; border-radius: 10px; background: radial-gradient(circle at 50% 82%, rgb(41 57 70 / 18%), transparent 35%); }
    .book-preview i, .book-preview b { position: absolute; display: block; }
    .book-preview .base { left: 50%; bottom: 24px; width: 210px; height: 112px; transform: translateX(-50%) rotateX(58deg); transform-style: preserve-3d; }
    .book-preview .left, .book-preview .right { top: 0; width: 50%; height: 100%; background: #f9fbfc; box-shadow: inset 0 0 18px rgb(54 73 88 / 13%); }
    .book-preview .left { left: 0; transform-origin: right center; }
    .book-preview .right { right: 0; transform-origin: left center; }
    .book-preview .gutter { z-index: 6; top: -2px; bottom: -4px; left: 50%; width: 18px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, rgb(35 53 68 / 20%), rgb(255 255 255 / 75%), transparent); }
    .book-preview .edge { z-index: 2; right: -4px; bottom: -7px; left: 2px; height: 9px; background: repeating-linear-gradient(#f8fafb 0 1px, #aebec8 1px 2px); }
    .preview-dom .right { animation: domFlip 2.8s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes domFlip { 0%, 18% { transform: rotateY(0); } 62%, 100% { transform: rotateY(-178deg); } }
    .preview-webgl .right { clip-path: polygon(0 0, 100% 5%, 94% 50%, 100% 96%, 0 100%); animation: curl 2.8s ease-in-out infinite; }
    @keyframes curl { 0%, 16% { transform: rotateY(0) skewY(0); } 55% { transform: rotateY(-105deg) translateZ(22px) skewY(-5deg); } 100% { transform: rotateY(-178deg) skewY(0); } }
    .preview-hybrid .base::before { position: absolute; inset: -5px -7px -9px; border-radius: 5px 10px 10px 5px; content: ""; background: #9ebdd4; transform: translateZ(-8px); }
    .preview-hybrid .right { animation: curl 3s ease-in-out infinite; }
    .preview-commercial .base { filter: drop-shadow(0 12px 10px rgb(30 45 56 / 28%)); }
    .preview-commercial .left, .preview-commercial .right { background: linear-gradient(135deg, #fff, #dfe8ed); }
    .preview-commercial .right { animation: curl 2.4s ease-in-out infinite; }
    .subchoices { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { position: relative; }
    .chip input { position: absolute; opacity: 0; }
    .chip span { display: inline-flex; min-height: 38px; padding: 0 14px; align-items: center; border: 1px solid #b7c7d2; border-radius: 999px; color: #405c6f; background: rgb(248 251 253 / 76%); cursor: pointer; }
    .chip input:checked + span { border-color: var(--blue); color: white; background: var(--blue); }
    textarea { width: 100%; min-height: 120px; padding: 14px 16px; border: 1px solid #adbec9; border-radius: 12px; color: var(--ink); background: var(--paper); resize: vertical; outline: none; }
    textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgb(40 104 173 / 14%); }
    .actions { display: flex; margin-top: 28px; flex-wrap: wrap; gap: 12px; }
    .actions button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; color: white; background: var(--blue); font-weight: 700; cursor: pointer; }
    .actions button:last-child { color: #315268; background: #dce8f0; }
    .answer { display: none; margin-top: 18px; padding: 18px; white-space: pre-wrap; border-radius: 12px; color: #29485e; background: #dfeaf1; font-size: 13px; line-height: 1.7; }
    .answer.visible { display: block; }
    @media (max-width: 760px) { main { width: min(100% - 20px, 680px); padding-top: 28px; } .intro, .choice-grid { grid-template-columns: 1fr; } .intro { gap: 18px; } .choice { padding: 18px; } }
    @media (prefers-reduced-motion: reduce) { .book-preview .right { animation: none !important; transform: rotateY(-32deg); } }
  </style>
</head>
<body>
  <main>
    <section class="intro">
      <h1>选一本真正像书的书。</h1>
      <p>下面不是四套颜色，而是四种不同的底层实现。请先打开真实演示，再选择你希望 Context Reader 靠近的方向。你的选择会决定封面厚度、书脊连续性、纸页弯曲方式和后续工程量。</p>
    </section>
    <p class="notice">当前“18 条竖向切片旋转”的栅栏翻页会被完整替换，不保留。窄桌面也会设置最小展开宽度，先保持书的比例，再决定是否轻微裁边或提前切换单页。</p>

    <form id="form">
      <fieldset>
        <legend>1. 核心书本与翻页路线（单选）</legend>
        <div class="choice-grid">
          <label class="choice">
            <input type="radio" name="engine" value="A · StPageFlip：真实 DOM 书页" />
            <div class="book-preview preview-dom" aria-hidden="true"><b class="base"><i class="left"></i><i class="right"></i><i class="gutter"></i><i class="edge"></i></b></div>
            <h2>A · StPageFlip<span>功能最稳，MIT 开源</span></h2>
            <p>硬封面与软纸页分开，支持最小宽高、单双页切换、阴影、拖角翻页，而且页面仍是可点击、可选择的 HTML。</p>
            <ul><li>最适合保留真实表单、划词和解释面板</li><li>翻页真实度中高，视觉上限低于完全 WebGL</li><li>移动端和无障碍风险最低</li></ul>
            <a href="https://nodlik.github.io/StPageFlip/demo.html" target="_blank" rel="noreferrer">打开真实演示</a>
          </label>

          <label class="choice">
            <input type="radio" name="engine" value="B · 混合方案：3D 书壳 + DOM 曲面翻页" checked />
            <div class="book-preview preview-hybrid" aria-hidden="true"><b class="base"><i class="left"></i><i class="right"></i><i class="gutter"></i><i class="edge"></i></b></div>
            <h2>B · 混合方案<span>推荐，最接近你的目标</span></h2>
            <p>封面、封底、书脊、纸芯厚度与灯光用 3D 书壳保持连续；实际内容页仍保留 DOM，并用真实单页卷曲替代栅栏。</p>
            <ul><li>开书前后可保持同一个书脊和书体</li><li>兼顾 Lusion 式空间感与 Context Reader 真功能</li><li>工程量高于 A，但明显低于全 WebGL 重写</li></ul>
            <a href="https://r3f-animated-book-slider-final.vercel.app/" target="_blank" rel="noreferrer">查看 3D 书体参考</a>
          </label>

          <label class="choice">
            <input type="radio" name="engine" value="C · 全 WebGL / R3F 曲面书页" />
            <div class="book-preview preview-webgl" aria-hidden="true"><b class="base"><i class="left"></i><i class="right"></i><i class="gutter"></i><i class="edge"></i></b></div>
            <h2>C · 全 WebGL / R3F<span>视觉上限最高，风险也最高</span></h2>
            <p>每张纸是带骨骼或 shader 变形的网格，灯光、遮挡、纸背与厚度都是真 3D。网页内容需要转成纹理或另外叠加交互层。</p>
            <ul><li>最有机会做到震撼的纸张弯曲</li><li>表单、选词、滚动与清晰文字对接最复杂</li><li>参考仓库没有明确许可证，只能借鉴效果自行实现</li></ul>
            <a href="https://github.com/wass08/r3f-animated-book-slider-final" target="_blank" rel="noreferrer">查看参考代码结构</a>
          </label>

          <label class="choice">
            <input type="radio" name="engine" value="D · Real3D 商业 WebGL 引擎" />
            <div class="book-preview preview-commercial" aria-hidden="true"><b class="base"><i class="left"></i><i class="right"></i><i class="gutter"></i><i class="edge"></i></b></div>
            <h2>D · Real3D 商业引擎<span>现成物理感，需付费许可</span></h2>
            <p>现成提供纸张弯曲、光照、阴影、纸张硬度和相机设置，适合 PDF/图片翻书。真实网页控件的融合不如 A/B 自然。</p>
            <ul><li>最快看到成熟 WebGL 翻书质感</li><li>更像杂志/PDF 阅读器，不天然适合工具型页面</li><li>采用前需要购买并确认商业许可证</li></ul>
            <a href="https://real3dflipbook.com/home-3/" target="_blank" rel="noreferrer">打开官方演示</a>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>2. 你希望从哪些参考里提取外观？（可多选）</legend>
        <div class="subchoices">
          <label class="chip"><input type="checkbox" name="reference" value="Codrops：六面体书壳、清楚可见的封面厚度和侧边" checked /><span>Codrops 六面体书壳</span></label>
          <label class="chip"><input type="checkbox" name="reference" value="Wawa R3F：连续书体、纸页堆叠与镜头光影" checked /><span>Wawa 连续书体</span></label>
          <label class="chip"><input type="checkbox" name="reference" value="StPageFlip：硬封面 + 柔软内页的翻页方式" checked /><span>StPageFlip 软硬页</span></label>
          <label class="chip"><input type="checkbox" name="reference" value="Real3D：纸张弯曲、接触阴影与纸厚参数" /><span>Real3D 光影纸厚</span></label>
        </div>
        <div class="actions"><a href="https://tympanus.net/Development/3DBookShowcase/" target="_blank" rel="noreferrer" style="color:#2868ad;font-size:12px;font-weight:700">打开 Codrops 书壳演示</a></div>
      </fieldset>

      <fieldset>
        <legend>3. 窄桌面怎样处理？（单选）</legend>
        <div class="subchoices">
          <label class="chip"><input type="radio" name="narrow" value="保持最小展开宽度，允许左右轻微裁边" checked /><span>最小宽度 + 轻微裁边</span></label>
          <label class="chip"><input type="radio" name="narrow" value="保持比例，整体等比缩小" /><span>整书等比缩小</span></label>
          <label class="chip"><input type="radio" name="narrow" value="更早切换为单页书" /><span>提前切成单页</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>4. 哪些质感是必须的？（可多选）</legend>
        <div class="subchoices">
          <label class="chip"><input type="checkbox" name="must" value="开书前后同一个书脊，不允许突然消失" checked /><span>书脊连续</span></label>
          <label class="chip"><input type="checkbox" name="must" value="封面、封底和纸芯都有可见厚度" checked /><span>完整厚度</span></label>
          <label class="chip"><input type="checkbox" name="must" value="翻页必须是一整张纸连续弯曲" checked /><span>整页弯曲</span></label>
          <label class="chip"><input type="checkbox" name="must" value="纸张正反面与遮挡关系正确" checked /><span>正确纸背</span></label>
          <label class="chip"><input type="checkbox" name="must" value="接触阴影随翻页移动" checked /><span>动态接触阴影</span></label>
          <label class="chip"><input type="checkbox" name="must" value="允许用户拖动页角" /><span>可拖页角</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>5. 你的补充</legend>
        <textarea name="notes" placeholder="例如：我喜欢 B 的书壳，但翻页更想接近 D；封面希望更像精装工具书，不像杂志。"></textarea>
      </fieldset>

      <div class="actions">
        <button type="button" id="generate">生成答案</button>
        <button type="button" id="copy">复制答案</button>
      </div>
      <output class="answer" id="answer"></output>
    </form>
  </main>
  <script>
    const form = document.querySelector('#form');
    const answer = document.querySelector('#answer');
    function checked(name) {
      return [...form.querySelectorAll(`[name="${name}"]:checked`)].map((item) => item.value);
    }
    function generate() {
      const value = [
        'Context Reader 书本模型选择',
        `核心路线：${checked('engine')[0] || '未选择'}`,
        `外观参考：${checked('reference').join('；') || '未选择'}`,
        `窄桌面：${checked('narrow')[0] || '未选择'}`,
        `必须质感：${checked('must').join('；') || '未选择'}`,
        `补充：${form.elements.notes.value.trim() || '无'}`,
      ].join('\n');
      answer.textContent = value;
      answer.classList.add('visible');
      return value;
    }
    document.querySelector('#generate').addEventListener('click', generate);
    document.querySelector('#copy').addEventListener('click', async () => {
      const value = generate();
      try {
        await navigator.clipboard.writeText(value);
        document.querySelector('#copy').textContent = '已复制';
        setTimeout(() => document.querySelector('#copy').textContent = '复制答案', 1200);
      } catch {
        window.prompt('复制下面的答案：', value);
      }
    });
  </script>
</body>
</html>
